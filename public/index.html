<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enkrip Ringan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Enkrip</h1>
  <p>Pilih metode enkripsi, masukkan teks, lalu klik tombol.</p>

  <label for="text">Teks</label>
  <textarea id="text" placeholder="Masukkan teks di sini"></textarea>

  <label for="method">Metode</label>
  <select id="method">
    <option value="base64">Base64</option>
    <option value="caesar">Caesar</option>
    <option value="aes">AES</option>
    <option value="rot13">ROT13</option>
  </select>

  <label for="key">Kunci (AES)</label>
  <input type="text" id="key" placeholder="Masukkan kunci...">

  <label for="shift">Shift (Caesar)</label>
  <input type="number" id="shift" value="3">

  <div class="buttons">
    <button id="encBtn">Enkripsi</button>
    <button id="decBtn">Dekripsi</button>
    <button onclick="copyResult()">Salin hasil</button>
  </div>

  <label for="output">Hasil</label>
  <textarea id="output" readonly></textarea>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
